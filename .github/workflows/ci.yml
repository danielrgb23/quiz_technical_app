name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  # Manual apenas (workflow_dispatch): o pipeline de geração de questões usa
  # a API da Anthropic e tem custo por chamada. Mesmo este job só rodando
  # pytest (sem chamadas reais ao LLM), a decisão de quando rodá-lo é sempre
  # do dono do projeto — nunca automática em push/PR. `generate`/`run` seguem
  # 100% manuais e locais (ver pipeline/README.md).
  pipeline:
    name: Pipeline (Python)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: python -m pytest

  app:
    name: App Flutter (make ci)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: dart pub global activate melos 6.3.0
      - run: make setup
      - run: make ci

  build-android:
    name: Build APK (tags)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [app]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: dart pub global activate melos 6.3.0
      - run: make setup
      - run: |
          cd apps/quiz_app
          flutter build apk --flavor prod --dart-define-from-file=env/prod.json \
            --build-name=${GITHUB_REF_NAME#v} --build-number=${{ github.run_number }}
      - uses: actions/upload-artifact@v4
        with:
          name: quiz-app-prod-apk
          path: app/apps/quiz_app/build/app/outputs/flutter-apk/*.apk
