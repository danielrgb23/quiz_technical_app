[project]
name = "questions-pipeline"
version = "0.1.0"
description = "Pipeline que baixa perguntas de entrevista mobile e gera MCQs via LLM"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "anthropic>=0.40",
    "pydantic>=2.7",
    "python-slugify>=8.0",
    "PyYAML>=6.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
