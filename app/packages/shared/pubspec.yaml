publish_to: none
version: 0.1.0

environment:
  sdk: ^3.10.0
  flutter: ">=3.38.0"

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  core:
    path: ../core
  question_bank_module:
    path: ../modules/question_bank
  get_it: ^8.0.3
  injectable: ^2.5.0
  connectivity_plus: ^6.1.4
